name: Smoke Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py agent.py

      - name: Check browser JavaScript syntax
        run: node --check frontend/app.js

      - name: Check example learning card
        run: |
          python - <<'PY'
          from pathlib import Path
          from agent import read_course_material

          raw = Path("materials/course_card.md").read_text(encoding="utf-8")
          card = read_course_material("course_card", raw)
          assert card["material_id"] == "course_card"
          assert [section["label"] for section in card["sections"]] == ["A", "B", "C"]
          print("Learning card OK:", card["version"])
          PY

      - name: Start local app without credentials
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8004 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          sleep 2

      - name: Check local API, editable card, and missing-config recovery
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8004"

          def get_json(path):
              with urllib.request.urlopen(BASE + path) as response:
                  return json.loads(response.read().decode("utf-8"))

          def post_json(path, payload):
              request = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))

          health = get_json("/api/health")
          assert health["status"] == "ok"
          assert health["configuration"]["configured"] is False

          state = get_json("/api/state")
          material = get_json("/api/material")
          assert material["material_id"] == "course_card"
          assert material["raw"]
          assert material["example_raw"]

          with urllib.request.urlopen(BASE + "/") as response:
              html = response.read().decode("utf-8")
              assert "AI Agent Lab" in html
              assert "YOUR TASK IN CHAT" in html
              assert "Apply Card" in html

          # Apply a participant learning-card change and verify that it becomes
          # the backend-owned source for a fresh session.
          changed_card = material["raw"].replace(
              "Individual dialogue takes time.",
              "Individual dialogue takes time and requires facilitator attention.",
          )
          applied_card = post_json(
              "/api/material",
              {
                  "session_id": state["session_id"],
                  "material": changed_card,
              },
          )
          assert applied_card["session_id"] != state["session_id"]
          assert applied_card["material"]["version"] != material["version"]

          current_card = get_json("/api/material")
          assert "requires facilitator attention" in current_card["raw"]

          state_after_card = get_json("/api/state")
          assert state_after_card["history"] == []
          assert state_after_card["turn_count"] == 0
          assert state_after_card["material_version"] == current_card["version"]

          # Invalid card structure must be rejected without replacing the applied card.
          bad_request = urllib.request.Request(
              BASE + "/api/material",
              data=json.dumps({
                  "session_id": state_after_card["session_id"],
                  "material": "# Broken card\n\nNo A/B/C sections"
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(bad_request)
              raise AssertionError("Malformed learning card unexpectedly succeeded")
          except urllib.error.HTTPError as error:
              payload = json.loads(error.read().decode("utf-8"))
              assert payload["error"]["code"] == "material_structure"

          unchanged = get_json("/api/material")
          assert unchanged["version"] == current_card["version"]

          # Chat still starts cleanly without credentials and fails explicitly.
          request = urllib.request.Request(
              BASE + "/api/chat",
              data=json.dumps({
                  "session_id": state_after_card["session_id"],
                  "message": "Hello"
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              urllib.request.urlopen(request)
              raise AssertionError("Chat unexpectedly succeeded without configuration")
          except urllib.error.HTTPError as error:
              payload = json.loads(error.read().decode("utf-8"))
              assert payload["error"]["code"] == "configuration_missing"

          after = get_json("/api/state")
          assert after["history"] == []
          assert after["turn_count"] == 0

          print("Local smoke checks passed")
          PY

      - name: Show server log on failure
        if: failure()
        run: cat uvicorn.log || true
