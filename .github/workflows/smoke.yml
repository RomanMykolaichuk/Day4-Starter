name: Workshop Smoke Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r day5/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile day4/app.py day4/agent.py
          python -m py_compile day5/app.py day5/agent.py

      - name: Check browser JavaScript syntax
        run: |
          node --check day4/frontend/app.js
          node --check day5/frontend/app.js

      - name: Check Day 4 and Day 5 separation
        run: |
          python - <<'PY'
          from pathlib import Path

          day4_app = Path("day4/app.py").read_text(encoding="utf-8")
          day5_app = Path("day5/app.py").read_text(encoding="utf-8")
          day4_html = Path("day4/frontend/index.html").read_text(encoding="utf-8")
          day5_html = Path("day5/frontend/index.html").read_text(encoding="utf-8")

          assert 'APP_VERSION = "0.3.4"' in day4_app
          assert 'APP_VERSION = "0.4.0"' in day5_app
          assert "singleModeBtn" not in day4_html
          assert "singleModeBtn" in day5_html
          assert "multiModeBtn" in day5_html
          assert "similarityScore" in day5_html
          assert "evaluatorPanel" in day5_html
          assert "DAY 5" in day5_html
          print("Day 4 / Day 5 separation OK")
          PY

      - name: Check Day 5 similarity tool
        working-directory: day5
        run: |
          python - <<'PY'
          from agent import compare_prompt_similarity

          history = [{
              "role": "assistant",
              "turn_id": "turn_01",
              "content": (
                  "Guided dialogue keeps the learner actively involved by asking "
                  "focused questions and guiding the learner back to evidence. "
                  "A limitation is that the process can take several turns."
              ),
          }]

          similar = compare_prompt_similarity(
              "Guided dialogue keeps the learner actively involved by asking focused questions.",
              history,
          )
          different = compare_prompt_similarity(
              "A satellite image classifier needs labeled training examples.",
              history,
          )

          assert similar["score"] >= 70, similar
          assert similar["matched_turn_id"] == "turn_01"
          assert different["score"] < 45, different
          assert "not proof of copying" in similar["note"]
          print("Day 5 similarity tool OK")
          PY

      - name: Start both local apps without credentials
        run: |
          cd day4
          python -m uvicorn app:app --host 127.0.0.1 --port 8004 > ../uvicorn-day4.log 2>&1 &
          echo $! > ../day4.pid
          cd ../day5
          python -m uvicorn app:app --host 127.0.0.1 --port 8005 > ../uvicorn-day5.log 2>&1 &
          echo $! > ../day5.pid
          cd ..
          sleep 3

      - name: Check Day 4 API
        run: |
          python - <<'PY'
          import json
          import urllib.request

          BASE = "http://127.0.0.1:8004"

          def get_json(path):
              with urllib.request.urlopen(BASE + path) as response:
                  return json.loads(response.read().decode("utf-8"))

          health = get_json("/api/health")
          state = get_json("/api/state")
          assert health["status"] == "ok"
          assert state["app_version"] == "0.3.4"
          with urllib.request.urlopen(BASE + "/") as response:
              html = response.read().decode("utf-8")
              assert "DAY 4" in html
              assert "singleModeBtn" not in html
          print("Day 4 API OK")
          PY

      - name: Check Day 5 API and mode switch
        run: |
          python - <<'PY'
          import json
          import urllib.request

          BASE = "http://127.0.0.1:8005"

          def get_json(path):
              with urllib.request.urlopen(BASE + path) as response:
                  return json.loads(response.read().decode("utf-8"))

          def post_json(path, payload):
              req = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode("utf-8"))

          health = get_json("/api/health")
          state = get_json("/api/state")
          assert health["status"] == "ok"
          assert state["app_version"] == "0.4.0"
          assert state["mode"] == "single"

          switched = post_json(
              "/api/mode",
              {"session_id": state["session_id"], "mode": "multi"},
          )
          assert switched["mode"] == "multi"
          assert switched["session_id"] != state["session_id"]

          current = get_json("/api/state")
          assert current["mode"] == "multi"
          assert current["history"] == []
          assert current["last_similarity"] is None

          with urllib.request.urlopen(BASE + "/") as response:
              html = response.read().decode("utf-8")
              assert "DAY 5" in html
              assert "singleModeBtn" in html
              assert "multiModeBtn" in html
              assert "evaluatorPanel" in html
          print("Day 5 API and mode switch OK")
          PY

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "--- Day 4 ---"
          cat uvicorn-day4.log || true
          echo "--- Day 5 ---"
          cat uvicorn-day5.log || true
